apiVersion: apps/v1
kind: Deployment
metadata:
  name: evo1-bdw
  namespace: daai-brs-d
  labels:
    app.kubernetes.io/name: evo1-bdw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: evo1-bdw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evo1-bdw
    spec:
      serviceAccountName: evo1-bdw
      containers:
        - name: bdw
          image: docker-hub.nexus.bit.admin.ch/svabra/bit-data-workbench:0.9.29
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tib-daail-evo1-poc-query-engine-config
            - secretRef:
                name: tib-daail-evo1-poc-query-engine-secret
          env:
            - name: BDW_ENABLE_FILE_LOGGING
              value: "false"
            - name: DUCKDB_DATABASE
              value: /tmp/workspace/workspace.duckdb
            - name: TMPDIR
              value: /workspace/tmp
            - name: BDW_DUCKDB_MEMORY_LIMIT
              value: 20GiB
            - name: BDW_DUCKDB_THREADS
              value: "8"
            - name: BDW_DUCKDB_TEMP_DIRECTORY
              value: /workspace/tmp/duckdb-spill
            - name: BDW_DUCKDB_MAX_TEMP_DIRECTORY_SIZE
              value: 96GiB
            - name: BDW_DUCKDB_PRESERVE_INSERTION_ORDER
              value: "false"
            - name: BDW_QUERY_CACHE_DIR
              value: /workspace/query-cache
            - name: BDW_INGESTION_UPLOAD_DIR
              value: /workspace/ingestion-uploads
            - name: BDW_INGESTION_UPLOAD_CHUNK_BYTES
              value: "5242880"
            - name: BDW_INGESTION_UPLOAD_MAX_ARCHIVE_BYTES
              value: "32212254720"
            - name: BDW_INGESTION_UPLOAD_MAX_CSV_BYTES
              value: "32212254720"
            - name: BDW_INGESTION_UPLOAD_MAX_EXTRACTED_BYTES
              value: "32212254720"
            - name: BDW_INGESTION_UPLOAD_SESSION_TTL_HOURS
              value: "24"
            - name: BDW_INGESTION_ZIP_MAX_ENTRIES
              value: "100"
            - name: BDW_INGESTION_ZIP_MAX_EXPANSION_RATIO
              value: "100"
            - name: BDW_INGESTION_COPY_CHUNK_BYTES
              value: "8388608"
            - name: BDW_SERVICE_CONSUMPTION_CPU_MEMORY_INTERVAL_SECONDS
              value: "60"
            - name: BDW_SERVICE_CONSUMPTION_S3_INTERVAL_SECONDS
              value: "3600"
            - name: BDW_SERVICE_CONSUMPTION_RETENTION_HOURS
              value: "48"
            - name: BDW_SERVICE_CONSUMPTION_NODE_METRICS_ENABLED
              value: "false"
            - name: BDW_SERVICE_CONSUMPTION_PVC_CAPACITY_ENABLED
              value: "false"
            - name: BDW_QUERY_JOB_LOGGING_ENABLED
              value: "true"
            - name: BDW_QUERY_JOB_LOG_HEARTBEAT_SECONDS
              value: "10"
            - name: BDW_QUERY_JOB_LOG_TIMEZONE
              value: Europe/Zurich
            - name: BDW_QUERY_JOB_DUCKDB_PROFILING_ENABLED
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: bit-ros-trusted-certs
              mountPath: /myconfigmap/daai-brs-d/bit-ros-trusted-certs
              readOnly: true
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 32Gi
          startupProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 100Gi
        - name: bit-ros-trusted-certs
          configMap:
            name: bit-ros-trusted-certs
