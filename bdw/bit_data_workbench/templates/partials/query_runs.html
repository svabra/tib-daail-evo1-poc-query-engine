<section class="query-runs-page" data-query-runs-page data-query-runs-limit="100">
  <div class="home-section-header query-runs-page-header">
    <div>
      <span class="home-eyebrow">Query Runs</span>
      <h2>Recorded Query Runs</h2>
      <p>Inspect completed, failed, and cancelled query executions with recorded CPU and RAM telemetry.</p>
    </div>
    <button type="button" class="query-runs-chart-toggle" data-query-runs-toggle-charts aria-pressed="false" title="Show resource charts">
      <span class="query-runs-chart-toggle-switch" aria-hidden="true">
        <span class="query-runs-chart-toggle-thumb"></span>
      </span>
      <span class="query-runs-chart-toggle-copy" data-query-runs-toggle-label>Show resource charts</span>
    </button>
  </div>
  <div class="query-runs-status" data-query-runs-status>No recorded query runs yet.</div>
  <div class="query-run-history-list" data-query-runs-list>
    <p class="home-empty">No recorded query runs yet.</p>
  </div>
</section>
