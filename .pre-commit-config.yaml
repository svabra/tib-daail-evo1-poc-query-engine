exclude: |
  (?x)^(
    \.local/|
    \.venv/|
    \.tmp-pytest/|
    bdw/bit_data_workbench/static/vendor/|
    logs/|
    pytest-cache-files-[^/]+/|
    workspace/
  )

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        always_run: true
        args: [--requirement, bdw/requirements.txt]
